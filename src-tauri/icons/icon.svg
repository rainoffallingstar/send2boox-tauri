<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Slate to Royal Blue to Sunset Coral & Golden Sand -->
    <linearGradient id="bg" x1="10%" y1="8%" x2="90%" y2="92%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="35%" stop-color="#1C3D7A"/>
      <stop offset="70%" stop-color="#7C2D88"/>
      <stop offset="100%" stop-color="#E16142"/>
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <radialGradient id="ambientGlow" cx="30%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#F472B6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Sand Stream Gradient -->
    <linearGradient id="sandStream" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Fluid Cyan/Emerald Ribbon Gradient -->
    <linearGradient id="flowRibbon" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="glassDoc" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Squircle -->
  <rect x="72" y="72" width="880" height="880" rx="224" fill="url(#bg)"/>
  <rect x="72" y="72" width="880" height="880" rx="224" fill="url(#ambientGlow)"/>

  <!-- Subtle Rim Light -->
  <rect x="73" y="73" width="878" height="878" rx="223" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- Back Glass Layer / Silhouette -->
  <g filter="url(#softShadow)" transform="translate(180, 190)">
    <rect x="0" y="0" width="460" height="600" rx="96" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- Main Floating Document / Sheet (representing BOOX E-Ink page) -->
  <g filter="url(#softShadow)" transform="translate(230, 240)">
    <!-- Document Body -->
    <path d="M40 0 H280 L380 100 V440 C380 462 362 480 340 480 H40 C18 480 0 462 0 440 V40 C0 18 18 0 40 0 Z" fill="url(#glassDoc)"/>
    
    <!-- Folded Corner -->
    <path d="M280 0 V76 C280 94 294 100 312 100 H380 Z" fill="#CBD5E1"/>

    <!-- Document Content Lines (clean minimalist) -->
    <rect x="52" y="160" width="160" height="20" rx="10" fill="#94A3B8" fill-opacity="0.7"/>
    <rect x="52" y="210" width="260" height="18" rx="9" fill="#CBD5E1" fill-opacity="0.8"/>
    <rect x="52" y="254" width="220" height="18" rx="9" fill="#CBD5E1" fill-opacity="0.8"/>
    <rect x="52" y="298" width="270" height="18" rx="9" fill="#CBD5E1" fill-opacity="0.8"/>
    <rect x="52" y="342" width="180" height="18" rx="9" fill="#CBD5E1" fill-opacity="0.8"/>
  </g>

  <!-- Flowing Sand Wave Ribbon (forming dynamic Sand & Flow curve across document) -->
  <g filter="url(#softShadow)">
    <!-- Deep background curve -->
    <path d="M160 680 C320 740 460 620 580 500 C700 380 760 300 860 260" fill="none" stroke="url(#flowRibbon)" stroke-width="48" stroke-linecap="round" stroke-opacity="0.75"/>
    
    <!-- Golden Sand Stream Foreground -->
    <path d="M140 730 C300 780 460 670 600 520 C740 370 800 280 880 230" fill="none" stroke="url(#sandStream)" stroke-width="32" stroke-linecap="round" filter="url(#glowFilter)"/>
    
    <!-- Fine Light Accent Line -->
    <path d="M170 750 C320 790 480 690 620 540 C760 390 820 290 890 235" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-opacity="0.9"/>
  </g>

  <!-- Flowing Sand Particles / Stars (representing wireless flow / e-ink sparkle) -->
  <g filter="url(#glowFilter)">
    <!-- Primary Flow Sparkle -->
    <circle cx="880" cy="230" r="32" fill="#FFFFFF"/>
    <circle cx="880" cy="230" r="18" fill="#FDE68A"/>

    <!-- Streaming Sand Dots -->
    <circle cx="760" cy="340" r="16" fill="#FDE68A" fill-opacity="0.95"/>
    <circle cx="670" cy="440" r="13" fill="#FBBF24" fill-opacity="0.9"/>
    <circle cx="560" cy="540" r="11" fill="#F59E0B" fill-opacity="0.85"/>
    <circle cx="430" cy="650" r="9" fill="#FCD34D" fill-opacity="0.8"/>
    <circle cx="310" cy="730" r="7" fill="#FDE68A" fill-opacity="0.75"/>
    <circle cx="210" cy="760" r="6" fill="#FFFFFF" fill-opacity="0.7"/>

    <!-- Ambient sparkle stars -->
    <circle cx="320" cy="180" r="10" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="750" cy="180" r="14" fill="#60A5FA" fill-opacity="0.85"/>
    <circle cx="820" cy="140" r="8" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="190" cy="320" r="8" fill="#F472B6" fill-opacity="0.8"/>
  </g>
</svg>
