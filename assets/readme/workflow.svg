<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="240" viewBox="0 0 1200 240"
     role="img" aria-labelledby="title desc">
  <title id="title">sandFlos 推送工作流</title>
  <desc id="desc">sandFlos 推送流程：浏览器登录授权 → 选择本地书籍/文档 → Rust 直传 OSS → 推送消息同步到 BOOX 设备。所有步骤都由本地 Rust 进程完成。</desc>

  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C3D7A"/>
    </linearGradient>
    <linearGradient id="stepFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" rx="26" fill="url(#flowBg)"/>

  <!-- section label -->
  <text x="56" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3" fill="#FBBF24">HOW IT WORKS</text>
  <text x="56" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#F1F5F9">一次点击，从书库到墨水屏</text>

  <!-- 4 steps -->
  <!-- Step 1 -->
  <g transform="translate(56 120)">
    <rect x="0" y="0" width="240" height="92" rx="16" fill="#111B33" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">01</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">登录授权</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">浏览器扫码 · 本地回环回流</text>
  </g>

  <!-- arrow -->
  <path d="M304 166 L 344 166" stroke="#94A3B8" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M340 160 L 350 166 L 340 172" fill="none" stroke="#94A3B8" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Step 2 -->
  <g transform="translate(358 120)">
    <rect x="0" y="0" width="240" height="92" rx="16" fill="#111B33" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">02</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">选择文件</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">Zotero / Calibre / 本地</text>
  </g>

  <path d="M606 166 L 646 166" stroke="#94A3B8" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M642 160 L 652 166 L 642 172" fill="none" stroke="#94A3B8" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Step 3 -->
  <g transform="translate(660 120)">
    <rect x="0" y="0" width="240" height="92" rx="16" fill="#111B33" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">03</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">Rust 直传 OSS</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">STS 签名 · 进度 / 速度 / ETA</text>
    <rect x="16" y="84" width="208" height="2" fill="url(#sandGrad)" fill-opacity="0.9"/>
  </g>

  <path d="M908 166 L 948 166" stroke="#94A3B8" stroke-opacity="0.6" stroke-width="2"/>
  <path d="M944 160 L 954 166 L 944 172" fill="none" stroke="#94A3B8" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Step 4 -->
  <g transform="translate(962 120)">
    <rect x="0" y="0" width="180" height="92" rx="16" fill="#111B33" stroke="url(#sandGrad)" stroke-opacity="0.5"/>
    <text x="16" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#FBBF24">04</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">推送到设备</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">BOOX 墨水屏</text>
  </g>

  <!-- bottom flow ribbon -->
  <path d="M40 226 C 380 206 780 206 1160 222" fill="none" stroke="url(#stepFlow)" stroke-opacity="0.25" stroke-width="2"/>
</svg>
