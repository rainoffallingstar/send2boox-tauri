<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">sandFlos — BOOX 墨水屏桌面控制中心</title>
  <desc id="desc">sandFlos 是 100% Rust 与 GPUI 原生渲染的桌面应用，把书籍和文档推送到 BOOX 墨水屏设备。图中展示本地仪表盘：侧栏导航、概览卡片、实时上传进度与设备列表。</desc>

  <defs>
    <!-- sandFlos brand gradient: deep slate -> royal blue -> violet -> sunset coral -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="42%" stop-color="#1C3D7A"/>
      <stop offset="100%" stop-color="#7C2D88"/>
    </linearGradient>
    <linearGradient id="sandFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>

  <!-- subtle sand-flow backdrop arcs (motif, low opacity) -->
  <path d="M-20 340 C 260 300 480 220 640 120" fill="none" stroke="url(#sandFlow)" stroke-opacity="0.16" stroke-width="3"/>
  <path d="M-20 362 C 300 320 540 250 720 150" fill="none" stroke="url(#ribbon)" stroke-opacity="0.12" stroke-width="2"/>

  <!-- ============ LEFT: TITLE BLOCK ============ -->
  <g id="title-block" transform="translate(56 44)">

    <!-- eyebrow: category -->
    <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3" fill="#FBBF24">BOOX E-INK · DESKTOP CONTROL CENTER</text>

    <!-- wordmark -->
    <text x="-3" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="78" font-weight="800" fill="url(#wordmark)">sandFlos</text>

    <!-- one-line value -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="25" font-weight="600" fill="#E2E8F0">把书和文档推送到你的 BOOX 墨水屏设备</text>

    <!-- sub -->
    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" fill="#94A3B8">100% Rust · GPUI 原生 GPU 渲染 · 本地控制中心</text>

    <!-- metadata chips -->
    <g transform="translate(0 232)">
      <rect x="0" y="0" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="59" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#E2E8F0">Rust 2021</text>

      <rect x="128" y="0" width="128" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="192" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#E2E8F0">GPUI 0.2</text>

      <rect x="266" y="0" width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="341" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#E2E8F0">GPU Native</text>
    </g>
  </g>

  <!-- ============ RIGHT: DASHBOARD MOCKUP (project proof) ============ -->
  <g id="project-proof" transform="translate(672 40)">
    <!-- window frame -->
    <rect x="0" y="0" width="472" height="300" rx="18" fill="#0B132B" stroke="#FFFFFF" stroke-opacity="0.14"/>

    <!-- titlebar -->
    <rect x="0" y="0" width="472" height="42" rx="18" fill="#111B33"/>
    <circle cx="22" cy="21" r="6" fill="#FF5F57" fill-opacity="0.9"/>
    <circle cx="40" cy="21" r="6" fill="#FEBC2E" fill-opacity="0.9"/>
    <circle cx="58" cy="21" r="6" fill="#28C840" fill-opacity="0.9"/>
    <text x="236" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" fill="#CBD5E1">sandFlos 控制中心</text>

    <!-- sidebar -->
    <rect x="0" y="42" width="118" height="258" fill="#16233C"/>
    <!-- brand mark -->
    <rect x="14" y="14" width="28" height="28" rx="8" fill="url(#sandFlow)"/>
    <text x="28" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#0B132B">S</text>
    <text x="50" y="33" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">sandFlos</text>

    <!-- nav items -->
    <rect x="10" y="58" width="98" height="26" rx="7" fill="#38BDF8" fill-opacity="0.22"/>
    <text x="22" y="76" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#7DD3FC">概览</text>
    <text x="22" y="106" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">互动文件</text>
    <text x="22" y="132" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">设备</text>
    <text x="22" y="158" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">阅读</text>
    <text x="22" y="184" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">Zotero</text>
    <text x="22" y="210" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8">Calibre</text>

    <!-- content area -->
    <text x="134" y="34" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">概览</text>

    <!-- KPI cards -->
    <!-- card 1: 授权状态 -->
    <rect x="134" y="48" width="158" height="86" rx="12" fill="#1E293B" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="148" y="72" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#94A3B8">授权状态</text>
    <circle cx="152" cy="96" r="6" fill="#22C55E"/>
    <text x="166" y="102" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#4ADE80">已授权</text>

    <!-- card 2: 在线设备 -->
    <rect x="300" y="48" width="158" height="86" rx="12" fill="#1E293B" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="314" y="72" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" fill="#94A3B8">在线设备</text>
    <text x="314" y="104" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#F1F5F9">2 <tspan font-size="13" fill="#94A3B8">台</tspan></text>

    <!-- upload progress card -->
    <rect x="134" y="146" width="324" height="92" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="148" y="170" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#7DD3FC">正在上传并推送文件</text>
    <text x="148" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#E2E8F0" text-anchor="start">三体全集.epub</text>
    <!-- progress bar track -->
    <rect x="148" y="204" width="296" height="8" rx="4" fill="#0F172A"/>
    <!-- sand flow fill at 62% -->
    <rect x="148" y="204" width="184" height="8" rx="4" fill="url(#sandFlow)"/>
    <!-- speed / eta -->
    <text x="148" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94A3B8">12.4 MB/s · 00:08 剩余</text>

    <!-- sand flow ribbon across the window (motif) -->
    <path d="M-8 272 C 120 240 240 210 470 150" fill="none" stroke="url(#sandFlow)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <circle cx="-2" cy="270" r="4" fill="#FDE68A"/>
    <circle cx="120" cy="244" r="3" fill="#FBBF24"/>
    <circle cx="250" cy="212" r="2.5" fill="#F59E0B"/>
  </g>
</svg>
